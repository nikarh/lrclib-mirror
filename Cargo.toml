[package]
name = "lrclib-mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A self-hosted LRCLIB: the LRCLIB server and web search on a local copy of LRCLIB's public database dump, kept up to date"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/nikarh/lrclib-mirror"
readme = "README.md"
keywords = ["lrclib", "lyrics", "lrc", "mirror"]
categories = ["web-programming::http-server"]

[workspace]
# The upstream projects are submodules with workspaces of their own.
exclude = ["upstream"]

[dependencies]
arc-swap = "1.9.4"
axum = "0.7"
bytes = "1.12.1"
flate2 = "1.1.11"
pico-args = "0.5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = "0.31"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
server = { path = "upstream/lrclib/server" }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
# Duplicate transitive versions are tracked (with reasons) in deny.toml instead.
multiple_crate_versions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
panic = "abort"
