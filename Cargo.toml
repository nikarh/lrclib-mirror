[package]
name = "lrclib-mirror"
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
description = "A self-hosted LRCLIB: the LRCLIB server and web search on a local copy of LRCLIB's public database dump, kept up to date"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/nikarh/lrclib-mirror"
readme = "README.md"
keywords = ["lrclib", "lyrics", "lrc", "mirror"]
categories = ["web-programming::http-server"]

[workspace]
members = ["tools/compare"]
# The web search (a node project).
exclude = ["web"]

[dependencies]
aho-corasick = "1.1.5"
arc-swap = "1.9.4"
axum = "0.7"
bytes = "1.12.1"
collapse = "0.1.2"
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
jiff = { version = "0.2.41", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
mimalloc = "0.1.52"
pico-args = "0.5.0"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs"] }
secular = { version = "1.0.1", features = ["bmp", "normalization"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
tantivy = "0.26"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zstd = "0.13"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
# Duplicate transitive versions are tracked (with reasons) in deny.toml instead.
multiple_crate_versions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
panic = "abort"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
