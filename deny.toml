[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each of these comes with the upstream `server` crate (upstream/lrclib), which pins the dependents. Drop an entry once
# upstream has moved on.
ignore = [
  # idna 0.5 via validator 0.18. validator only uses idna for its `email` and `url` checks; the server's request
  # structs use `length` and `range` only.
  { id = "RUSTSEC-2024-0421", reason = "idna via validator, whose email/url checks the server doesn't use" },
  # proc-macro-error via validator_derive 0.18: unmaintained, compile time only.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc macro helper of validator_derive (build time only)" },
  # unsafe-libyaml via serde_yaml (the server's Lyricsfile support): unmaintained, not a known vulnerability.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, used by upstream's serde_yaml" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots: the Mozilla CA certificate list as data
  "CDLA-Permissive-2.0",
]

# The upstream server crate has no license field; the upstream repository is MIT licensed (upstream/lrclib/LICENSE).
[[licenses.clarify]]
crate = "server"
expression = "MIT"
license-files = []

[bans]
# The dependency tree is mostly upstream's (axum 0.7, rand 0.8, tantivy, ...), and the daily upstream update must not
# fail on duplicates that only upstream can resolve: reported, not denied.
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
