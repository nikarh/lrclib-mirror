[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # unsafe-libyaml via serde_yaml: unmaintained, not a known vulnerability. serde_yaml writes Lyricsfiles exactly as
  # LRCLIB's server does (it uses the same version); only serialization of known structures is used, no YAML parsing.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained; serde_yaml reproduces LRCLIB's Lyricsfiles byte for byte" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots: the Mozilla CA certificate list as data
  "CDLA-Permissive-2.0",
]

[bans]
# Duplicates come from dependencies' own trees (tantivy, axum 0.7, ...), and the daily Cargo.lock update must not fail
# on duplicates only they can resolve: reported, not denied.
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
