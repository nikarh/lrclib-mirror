[package]
name = "lrclib-compare"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Compares lrclib-mirror with LRCLIB's server: same answers, and how fast"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
futures = "0.3.34"
hdrhistogram = "7.6.0"
lrclib-mirror = { version = "0.1.0", path = "../.." }
pico-args = "0.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
