# Development tools and tasks. Rust itself comes from rust-toolchain.toml.
[tools]
node = "26.13.0"
git-cliff = "2.14.2"
cargo-deny = "0.20.2"

[tasks."web:install"]
description = "Install the web search's dependencies"
dir = "web"
run = "npm ci --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."web:build"]
description = "Build the web search into web/dist (embedded by the next cargo build)"
depends = ["web:install"]
dir = "web"
run = "npm run build"

[tasks."web:dev"]
description = "The web search's dev server at http://localhost:5173, against the server of `mise run dev`"
depends = ["web:install"]
dir = "web"
run = "npm run dev"

[tasks."dev:remote"]
description = "The web search's dev server at http://localhost:5173, against the lrclib-mirror at $LRCLIB_MIRROR_REMOTE"
depends = ["web:install"]
dir = "web"
run = '''
test -n "${LRCLIB_MIRROR_REMOTE:-}" || { echo "Set LRCLIB_MIRROR_REMOTE to the URL of a running lrclib-mirror (e.g. in mise.local.toml)" >&2; exit 1; }
npm run dev
'''

[tasks.dev]
description = "Run the server on ./dev-data (updates off: put a dump in dev-data/dumps)"
run = "cargo run -- --data-dir dev-data --listen 127.0.0.1:3300 --update-schedule off"

[tasks.fmt]
description = "Format the Rust code and the web search"
depends = ["web:install"]
run = ["cargo fmt", "npm --prefix web run format"]

[tasks.lint]
description = "rustfmt check, clippy, and the web search's oxfmt check, oxlint and type check"
depends = ["web:install"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --workspace --all-targets",
  "npm --prefix web run format:check",
  "npm --prefix web run lint",
  "npm --prefix web run typecheck",
]

[tasks.test]
description = "Run the tests"
run = "cargo test --locked --workspace"

[tasks.compare]
description = "Compare with LRCLIB's server on the same dump: same answers, and timings (see tools/compare)"
run = "cargo run --locked --release -p lrclib-compare --"

[tasks.deny]
description = "Audit dependencies: advisories, licenses, duplicates, sources"
run = "cargo deny check"

[tasks.ci]
description = "What CI's check job runs: that the web search builds, lint, tests, action pins"
# The web search first: the Rust build embeds web/dist, which a build running alongside empties and refills.
depends = ["web:build"]
run = [{ tasks = ["lint", "test"] }, "scripts/check-actions.sh"]

[tasks.check]
description = "Everything CI checks"
depends = ["ci", "deny"]

[tasks.build]
description = "Release build of the binary with the frontend embedded"
depends = ["web:build"]
run = "cargo build --locked --release -p lrclib-mirror"

[tasks.docker]
description = "Build the container image as lrclib-mirror:dev"
run = "{{env.CONTAINER_ENGINE | default(value='docker')}} build -t lrclib-mirror:dev ."
