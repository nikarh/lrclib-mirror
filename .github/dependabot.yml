version: 2
# Cargo.lock and web/package-lock.json are refreshed within the manifests' ranges by the daily Upstream workflow
# (`cargo update`, `npm update`); new major versions are added by hand.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
