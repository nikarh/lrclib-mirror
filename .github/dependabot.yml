version: 2
# Cargo.lock and web/package-lock.json are updated by hand (`cargo update`, `npm update`), as are new major versions.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
