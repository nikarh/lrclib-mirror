name: Publish

# Builds the static binary once, then pushes the container image to ghcr.io and signs and uploads the release files.
# There are no versions, only two rolling releases, each with an image:
# - `v2` ("Latest"): main (images `v2`, `main` and `v2-sha-<commit>`), from the Latest workflow
# - `v2-dev` ("Dev"): the pending upstream update (images `v2-dev` and `dev`), from the Dev workflow
# (The `v1` and `v1-dev` releases and images, and `sha-<commit>`, are the previous version's, no longer updated.)
on:
  workflow_call:
    inputs:
      tag:
        description: The release, v2 or v2-dev
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  TARGET: x86_64-unknown-linux-musl
  IMAGE: ghcr.io/nikarh/lrclib-mirror
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build, push the image
    if: github.repository_owner == 'nikarh'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}
      - name: Build the static binary with the web search embedded
        run: |
          set -euo pipefail
          # --version: e.g. 2.0.0+abc1234 (v2), 2.0.0-dev+abc1234 (v2-dev)
          export LRCLIB_MIRROR_VERSION_SUFFIX="${TAG#v2}+${GITHUB_SHA:0:7}"
          mise run web:build
          cargo build --locked --release --target "$TARGET" -p lrclib-mirror
          bin="target/$TARGET/release/lrclib-mirror"
          "$bin" --version

          mkdir -p out
          cp "$bin" "out/lrclib-mirror-$TARGET"
          # The MIT notices of LRCLIB's server (ported to this crate) and web search (reimplemented in web/).
          cp licenses/LICENSE-lrclib licenses/LICENSE-lrclib-homepage out/

          root=ci-rootfs
          mkdir -p "$root/etc/ssl/certs"
          install -m 755 "$bin" "$root/lrclib-mirror"
          cp /etc/ssl/certs/ca-certificates.crt "$root/etc/ssl/certs/"
          # A new named volume copies this mode, so any uid can write the stores.
          mkdir -m 1777 "$root/data"
      - name: Build the image
        run: |
          docker build -f Dockerfile.ci -t lrclib-mirror:ci \
            --label "org.opencontainers.image.version=$("target/$TARGET/release/lrclib-mirror" --version | cut -d' ' -f2-)" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" .
      - name: Check it runs read-only, without capabilities, as nobody
        run: |
          set -euo pipefail
          # No real dump: the listing points nowhere, the API answers 503 and the healthcheck passes.
          docker run -d --name lrclib-mirror --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -v data:/data -e LRCLIB_MIRROR_LISTING_URL=http://127.0.0.1:9/ lrclib-mirror:ci
          for _ in $(seq 20); do
            if docker exec lrclib-mirror /lrclib-mirror healthcheck; then exit 0; fi
            sleep 0.5
          done
          docker logs lrclib-mirror
          exit 1
      - name: Push the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $TAG == v2 ]]; then
            tags=(v2 main "v2-sha-$(git rev-parse HEAD)")
          else
            tags=(v2-dev dev)
          fi
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          for tag in "${tags[@]}"; do
            docker tag lrclib-mirror:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo "Pushed \`$IMAGE\`: ${tags[*]}"
            echo
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${tags[0]}")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: out/*
          if-no-files-found: error
          retention-days: 3

  upload:
    name: Sign and upload
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          # Files a newer build no longer has.
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e release/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done
