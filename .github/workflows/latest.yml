name: Latest

# Keeps the `v2` release ("Latest") at the tip of main: on every push the tag moves to the new commit and Publish
# builds, signs and uploads the files, and pushes the `v2` and `main` images. There are no versioned releases. (The
# `v1` release and image are the previous version, built from an SQLite copy of the dump: they stay as they were, see
# the README.)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest
  cancel-in-progress: true

jobs:
  tag:
    name: Move the v2 tag
    if: github.repository_owner == 'nikarh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Move the tag and update the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/rolling-release.sh v2 "Latest (${GITHUB_SHA:0:7})" --latest

  publish:
    name: Publish
    needs: tag
    # Publish pushes the image.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: v2
    secrets: inherit
