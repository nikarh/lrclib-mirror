name: Dev

# Builds the pending upstream update (the `upstream-update` branch of the Upstream workflow's pull request) as the
# `v1-dev` pre-release and the `v1-dev` image, so it can be tried before merging.
on:
  push:
    branches:
      - upstream-update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  tag:
    name: Move the v1-dev tag
    if: github.repository_owner == 'nikarh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Move the tag and update the pre-release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/rolling-release.sh v1-dev "v1 Dev (${GITHUB_SHA:0:7}, pending upstream update)" --prerelease

  publish:
    name: Publish
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: v1-dev
    secrets: inherit
